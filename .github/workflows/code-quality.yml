name: Code quality

on:
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bunx oxlint

            - name: Check formatting
              run: bunx oxfmt --check
