name: Code quality

on:
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bunx oxlint

            - name: Check formatting
              run: bunx oxfmt --check

    cms-tests:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_HOST_AUTH_METHOD: trust
                    POSTGRES_USER: postgres
                    POSTGRES_DB: cms_test
                ports:
                    - 54320:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: CMS tests
              run: bun run test
              working-directory: apps/cms
